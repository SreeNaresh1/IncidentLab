services:
  service-c:
    build: ./services/service-c
    volumes:
      - ./services/service-c/main.py:/app/main.py:ro
    environment:
      # CAPACITY: semaphore slot count.
      CAPACITY: "${CAPACITY:-8}"
      # PROCESSING_MS: simulated processing time.
      # BASELINE: 50ms (healthy capacity: 8 / 0.050s = 160 req/s > 100 req/s load).
      # Degraded (BREAK & FIX): 90ms (degraded capacity: 8 / 0.090s = 88.9 req/s < 100 req/s load).
      PROCESSING_MS: "${PROCESSING_MS:-50}"
    ports:
      - "127.0.0.1:8012:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 2s
      timeout: 3s
      retries: 15

  service-b:
    build: ./services/service-b
    depends_on:
      service-c:
        condition: service_healthy
    volumes:
      - ./services/service-b/main.py:/app/main.py:ro
    environment:
      C_URL: "http://service-c:8000/charge"
      MITIGATION_ENABLED: "${MITIGATION_ENABLED:-false}"
      # C_TIMEOUT_MS: client-side timeout for calls to service-c.
      # Healthy execution is 50ms.
      # Under degraded C (90ms processing + queue backlog), requests exceed 100ms and timeout.
      C_TIMEOUT_MS: "100"
      # Naive path (MITIGATION_ENABLED=false): retries immediately up to 3 times (4 attempts total).
      NAIVE_MAX_RETRIES: "3"
      # Mitigated path (MITIGATION_ENABLED=true):
      MITIGATED_MAX_RETRIES: "1"
      BACKOFF_BASE_MS: "10"
      BACKOFF_JITTER_MS: "10"
      RETRY_BUDGET_PER_WINDOW: "2"
      RETRY_BUDGET_WINDOW_MS: "2000"
      BREAKER_ERROR_THRESHOLD: "0.5"
      BREAKER_WINDOW_SIZE: "5"
      BREAKER_COOLDOWN_MS: "1000"
    ports:
      - "127.0.0.1:8011:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 2s
      timeout: 3s
      retries: 15

  service-a:
    build: ./services/service-a
    depends_on:
      service-b:
        condition: service_healthy
    volumes:
      - ./services/service-a/main.py:/app/main.py:ro
    environment:
      B_URL: "http://service-b:8000/process"
      # A_TIMEOUT_MS: client-facing gateway timeout. Caps any single request
      # lifecycle so open-loop k6 VU pools remain deterministic and never exhaust.
      A_TIMEOUT_MS: "3000"
    ports:
      - "127.0.0.1:8010:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 2s
      timeout: 3s
      retries: 15

  k6:
    image: grafana/k6:1.3.0
    profiles: ["tools"]
    volumes:
      - ./load:/scripts
      - ./results:/scripts/results
    environment:
      TARGET_URL: "http://service-a:8000"
    depends_on:
      - service-a

  prometheus:
    image: prom/prometheus:v2.53.5
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9091:9090"

  grafana:
    image: grafana/grafana:13.1.3
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_SECURITY_ADMIN_PASSWORD: "incidentlab"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
