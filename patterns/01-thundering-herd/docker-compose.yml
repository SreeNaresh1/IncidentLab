services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_DB: incidentlab
      POSTGRES_USER: incidentlab
      POSTGRES_PASSWORD: incidentlab
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incidentlab"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  app:
    build: ./app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://incidentlab:incidentlab@postgres:5432/incidentlab
      REDIS_URL: redis://redis:6379/0
      MITIGATION_ENABLED: "${MITIGATION_ENABLED:-false}"
      CACHE_TTL_SECONDS: "5"
      CACHE_TTL_JITTER_SECONDS: "2"
      DB_QUERY_DELAY_MS: "150"
      DB_POOL_MAX_SIZE: "10"
      LOCK_WAIT_TIMEOUT_MS: "2000"
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 2s
      timeout: 3s
      retries: 15

  k6:
    image: grafana/k6:1.3.0
    user: root
    profiles: ["tools"] # only runs via `docker compose run k6 ...`, not `up`
    volumes:
      - ./load:/scripts
      - ./results:/scripts/results
    environment:
      TARGET_URL: "http://app:8000"
    depends_on:
      - app

  prometheus:
    image: prom/prometheus:v2.53.5
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:13.1.3
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # Viewer, not Admin — anonymous visitors can watch the dashboard
      # while a lab is running but can't modify it. There's no reason for
      # a local teaching lab to grant anonymous admin rights.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_SECURITY_ADMIN_PASSWORD: "incidentlab"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
