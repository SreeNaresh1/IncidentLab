name: New Pattern Proposal
description: Propose a new canonical distributed systems failure pattern for IncidentLab
title: "[Pattern Proposal]: "
labels: ["enhancement", "pattern-proposal"]
body:
  - type: markdown
    attributes:
      value: |
        IncidentLab prioritizes canonical, deterministic, and architecturally distinct failure modes. Please review the [Pattern Schema](schema/pattern.schema.yaml) before submitting.
  - type: input
    id: pattern_name
    attributes:
      label: Pattern Name
      placeholder: e.g., Unbounded Queue OOM Collapse, Distributed Deadlock, Clock Drift
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Failure Domain / Category
      options:
        - "Resource Depletion / Memory / Backpressure"
        - "Locking / Deadlocks / Concurrency"
        - "Consensus / Leader Election / Split-Brain"
        - "Time / Clock Synchronization / Leases"
        - "Cascading Failure / Retries"
        - "Caching / Stampedes"
        - "Other"
    validations:
      required: true
  - type: textarea
    id: topology
    attributes:
      label: Minimal Topology
      description: What is the minimal set of Docker containers needed to reproduce this without excess bloat?
      placeholder: e.g., 1 Producer + 1 Slow Consumer + 1 In-Memory Broker
    validations:
      required: true
  - type: textarea
    id: mechanism
    attributes:
      label: Failure Trigger & Mechanism
      description: How is the failure deterministically triggered in BREAK, and what is the measurable symptom?
    validations:
      required: true
  - type: textarea
    id: mitigation
    attributes:
      label: Architectural Mitigation
      description: What production-grade technique or algorithm mitigates the incident in FIX?
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: Real-World References & Postmortems
      description: Link any public postmortems (AWS, Cloudflare, Meta, Netflix, etc.) demonstrating this failure in production.
